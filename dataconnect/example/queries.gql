mutation CreateUser @auth(level: USER) {
  user_insert(data: { id_expr: "auth.uid", email: "user@example.com", role: "customer", createdAt_expr: "request.time" })
}

mutation UpdateUser @auth(level: USER) {
  user_update(key: { id_expr: "auth.uid" }, data: { fullName: "New Name" })
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: { id_expr: "auth.uid" })
}

query GetUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) { id email fullName }
}

query ListUsers @auth(level: PUBLIC, insecureReason: "Publicly visible agent directory") {
  users(where: { role: { eq: "agent" } }) { id fullName phoneNumber }
}

mutation CreateListing @auth(level: USER) {
  listing_insert(data: { title: "House", price: 100000, listingType: "sale", county: "County", neighborhood: "Hood", propertyType: "house", agent: { id_expr: "auth.uid" } })
}

mutation UpdateListing @auth(level: USER) {
  listing_update(key: { id: "00000000-0000-0000-0000-000000000000" }, data: { price: 150000 })
}

mutation DeleteListing @auth(level: USER) {
  listing_delete(key: { id: "00000000-0000-0000-0000-000000000000" })
}

query GetListing @auth(level: PUBLIC, insecureReason: "Listing details should be public") {
  listing(id: "00000000-0000-0000-0000-000000000000") { title price description }
}

query ListListings @auth(level: PUBLIC, insecureReason: "Listings should be public") {
  listings { title price }
}

mutation CreateFavorite @auth(level: USER) {
  favorite_insert(data: { user: { id_expr: "auth.uid" }, listing: { id: "00000000-0000-0000-0000-000000000000" } })
}

mutation DeleteFavorite @auth(level: USER) {
  favorite_delete(key: { id: "00000000-0000-0000-0000-000000000000" })
}

query ListFavorites @auth(level: USER) {
  favorites(where: { userId: { eq_expr: "auth.uid" } }) { listing { title } }
}

mutation CreateVisitRequest @auth(level: USER) {
  visitRequest_insert(data: { requestedDate: "2025-01-01T12:00:00Z", status: "pending", seeker: { id_expr: "auth.uid" }, listing: { id: "00000000-0000-0000-0000-000000000000" } })
}

mutation UpdateVisitRequest @auth(level: USER) {
  visitRequest_update(key: { id: "00000000-0000-0000-0000-000000000000" }, data: { status: "cancelled" })
}

mutation DeleteVisitRequest @auth(level: USER) {
  visitRequest_delete(key: { id: "00000000-0000-0000-0000-000000000000" })
}

query GetVisitRequest @auth(level: USER) {
  visitRequest(key: { id: "00000000-0000-0000-0000-000000000000" }) { status requestedDate }
}

query ListVisitRequests @auth(level: USER) {
  visitRequests(where: { seekerId: { eq_expr: "auth.uid" } }) { id status }
}

mutation CreateReview @auth(level: USER) {
  review_insert(data: { rating: 5, comment: "Great!", createdAt_expr: "request.time", reviewer: { id_expr: "auth.uid" }, agent: { id: "00000000-0000-0000-0000-000000000000" } })
}

mutation UpdateReview @auth(level: USER) {
  review_update(key: { id: "00000000-0000-0000-0000-000000000000" }, data: { comment: "Updated comment" })
}

mutation DeleteReview @auth(level: USER) {
  review_delete(key: { id: "00000000-0000-0000-0000-000000000000" })
}

query GetReview @auth(level: PUBLIC, insecureReason: "Reviews are public") {
  review(key: { id: "00000000-0000-0000-0000-000000000000" }) { rating comment }
}

query ListReviews @auth(level: PUBLIC, insecureReason: "Reviews are public") {
  reviews { rating comment reviewer { fullName } }
}